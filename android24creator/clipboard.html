<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><title>MN24 Clipboard Bridge</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#07111f;color:#e7f1ff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:760px;margin:auto}.panel{background:#102139;border:1px solid #294768;border-radius:14px;padding:18px}textarea{width:100%;min-height:150px;background:#071727;color:#fff;border:1px solid #34516e;border-radius:9px;padding:12px;font:inherit}button{padding:11px 16px;margin:8px 8px 0 0;border:0;border-radius:9px;background:#17617b;color:#fff;font-weight:600}#status{color:#9ed4ff;min-height:1.5em}.muted{color:#9db1c9}
</style>
<script src="/app/clipboard.js" defer></script>
</head><body><main><p class="muted">MN24 LABS · ANDROID24CREATOR · HOLOOS</p><h1>MN24 Clipboard Bridge</h1><section class="panel"><label for="text">Texto</label><textarea id="text" placeholder="Escribe texto para copiar o pulsa Pegar…"></textarea><div><button id="copy" type="button">Copiar texto</button><button id="paste" type="button">Pegar texto</button><button id="clear" type="button">Limpiar campo</button></div><p id="status" role="status" aria-live="polite"></p></section><p class="muted">El acceso al portapapeles requiere HTTPS o localhost y puede solicitar permiso. Pegar solo se ejecuta al pulsar el botón. El texto no se guarda en el servidor.</p></main>
<script>
const field=document.getElementById('text'),status=document.getElementById('status');
document.getElementById('copy').addEventListener('click',async()=>{try{await MN24Clipboard.copyText(field.value);status.textContent='Texto copiado.';}catch(e){status.textContent='No se pudo copiar: '+e.message;}});
document.getElementById('paste').addEventListener('click',async()=>{try{field.value=await MN24Clipboard.pasteText();status.textContent='Texto pegado.';}catch(e){status.textContent='No se pudo pegar: '+e.message;}});
document.getElementById('clear').addEventListener('click',()=>{field.value='';status.textContent='Campo limpiado. El portapapeles del sistema no se modificó.';});
</script></body></html>

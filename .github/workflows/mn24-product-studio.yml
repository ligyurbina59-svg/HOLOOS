name: MN24 Product Studio tests

on:
  push:
    branches:
      - feat/mn24-ai-product-studio
  pull_request:
    branches:
      - feat/android24creator-github-integration
      - main

jobs:
  product-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-termux.txt
      - run: python -m compileall -q android24creator_backend integrations
      - run: pytest -q
